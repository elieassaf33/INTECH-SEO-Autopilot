name: INTECH SEO Autopilot - all clients
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
  id-token: write
jobs:
  weekly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Search Console client
        run: pip install -r requirements.txt
      - name: Check scripts
        run: python -m unittest discover -s tests -v
      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/110513102800/locations/global/workloadIdentityPools/intech-github/providers/github
          service_account: intech-seo-autopilot@intech-seo-autopilot.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Audit all registered clients
        env:
          GCP_USE_ADC: 'true'
        run: python scripts/intech_controller.py
      - name: Publish weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intech-weekly-seo-report
          path: seo-reports/controller/
          retention-days: 90
