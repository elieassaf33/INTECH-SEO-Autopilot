name: INTECH SEO Autopilot - all clients
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
  id-token: write
concurrency:
  group: weekly-seo-monitor
  cancel-in-progress: false
jobs:
  weekly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Search Console client
        run: pip install -r requirements.txt
      - name: Check scripts
        run: python -m unittest discover -s tests -v
      - name: Authenticate to Google Cloud (keyless)
        continue-on-error: true
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/110513102800/locations/global/workloadIdentityPools/intech-github/providers/github
          service_account: intech-seo-autopilot@intech-seo-autopilot.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Audit all registered clients
        env:
          GCP_USE_ADC: 'true'
        run: python scripts/intech_controller.py
      - name: Publish weekly report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intech-weekly-seo-report-${{ github.run_id }}
          path: seo-reports/controller/
          retention-days: 90
          if-no-files-found: error
      - name: Publish summary and enforce property health
        if: always()
        run: python scripts/report_health.py
