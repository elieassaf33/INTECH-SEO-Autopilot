name: INTECH SEO Autopilot - all clients
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
  id-token: write
concurrency:
  group: weekly-seo-monitor
  cancel-in-progress: false
jobs:
  weekly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Search Console client
        run: pip install -r requirements.txt
      - name: Check scripts
        run: python -m unittest discover -s tests -v
      - name: Authenticate to Google Cloud (keyless)
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/110513102800/locations/global/workloadIdentityPools/intech-github/providers/github
          service_account: intech-seo-autopilot@intech-seo-autopilot.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Audit all registered clients
        env:
          GCP_USE_ADC: 'true'
        run: python scripts/intech_controller.py
      - name: Publish weekly report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intech-weekly-seo-report-${{ github.run_id }}
          path: seo-reports/controller/
          retention-days: 90
          if-no-files-found: error
      - name: Publish summary and enforce property health
        if: always()
        run: python scripts/report_health.py
