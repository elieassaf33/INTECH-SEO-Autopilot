name: Weekly free keyword discovery and metadata updates
on:
  workflow_run:
    workflows: [INTECH SEO Autopilot - all clients]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Apply checked titles and descriptions (never visible page text)
      limit:
        type: string
        default: '0'
        description: Maximum properties to research (0 means all configured properties)
permissions:
  contents: read
  actions: read
concurrency:
  group: seo-production-repairs
  cancel-in-progress: false
jobs:
  metadata:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Download latest successful main audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/workflows/intech-seo-controller.yml/runs?branch=main&status=completed&per_page=1" > /tmp/metadata-audit.json
          run_id=$(python - <<'PY'
          import json
          runs = json.load(open('/tmp/metadata-audit.json'))['workflow_runs']
          assert runs and runs[0]['conclusion'] == 'success', 'Latest main audit must pass'
          print(runs[0]['id'])
          PY
          )
          gh run download "$run_id" --pattern 'intech-weekly-seo-report-*' --dir seo-reports/metadata/audit
      - name: Discover free keywords and prepare metadata only
        env:
          RESEARCH_LIMIT: ${{ inputs.limit || '0' }}
        run: |
          audit_report=$(find seo-reports/metadata/audit -type f -name report.json -print -quit)
          test -n "$audit_report"
          python scripts/free_metadata_research.py --audit "$audit_report" --limit "$RESEARCH_LIMIT"
      - name: Publish checked metadata through restricted installed worker
        if: >-
          vars.SEO_METADATA_PUBLISH_ENABLED == 'true' &&
          (github.event_name == 'workflow_run' || inputs.publish)
        env:
          REPAIR_KEY: ${{ secrets.SEO_REPAIR_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SEO_REPAIR_KNOWN_HOSTS }}
          REPAIR_HOST: ${{ vars.SEO_REPAIR_HOST }}
        run: |
          test -n "$REPAIR_KEY" && test -n "$KNOWN_HOSTS" && test -n "$REPAIR_HOST"
          test -s seo-reports/metadata/proposals.json
          install -d -m 700 "$RUNNER_TEMP/seo-ssh"
          trap 'rm -f "$RUNNER_TEMP/seo-ssh/key"' EXIT
          printf '%s\n' "$REPAIR_KEY" > "$RUNNER_TEMP/seo-ssh/key"
          chmod 600 "$RUNNER_TEMP/seo-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/seo-ssh/known_hosts"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/seo-ssh/known_hosts" -i "$RUNNER_TEMP/seo-ssh/key" "root@$REPAIR_HOST" metadata < seo-reports/metadata/proposals.json > seo-reports/metadata/publication.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=json.loads(Path('seo-reports/metadata/publication.json').read_text())
          assert report['scope']=='metadata_only'
          expected={'free_metadata.py','keyword_publisher.py','keyword_content.py','production_repairs.py','technical_audit.py','metadata_pages.py','change_history.py'}
          assert set(report['dependencies_sha256'])==expected
          for name, digest in report['dependencies_sha256'].items():
              assert digest==hashlib.sha256((Path('scripts')/name).read_bytes()).hexdigest(), 'Installed dependency differs: '+name
          assert report['targets_sha256']==hashlib.sha256(Path('metadata-targets.json').read_bytes()).hexdigest()
          assert report['worker_sha256']==hashlib.sha256(Path('scripts/metadata_worker.py').read_bytes()).hexdigest()
          assert not any(r['status']=='blocked' for r in report['results'])
          PY
      - name: Publish metadata summary
        if: always()
        env:
          PUBLISH_ENABLED: ${{ vars.SEO_METADATA_PUBLISH_ENABLED }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Free keyword discovery: titles and descriptions only\n\n')
              out.write('Automatic publishing enabled: '+str(os.environ['PUBLISH_ENABLED']=='true')+'\n\n')
              for filename in ['proposals.json','publication.json']:
                  path=Path('seo-reports/metadata')/filename
                  if path.exists() and path.stat().st_size:
                      for row in json.loads(path.read_text())['results']:
                          out.write('- '+row['gsc_property']+': '+row['status']+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: free-keyword-metadata-${{ github.run_id }}
          path: seo-reports/metadata/
          retention-days: 90
          if-no-files-found: warn
