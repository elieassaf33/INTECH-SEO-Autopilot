name: Verify Google Search Console connection
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google authentication libraries
        run: pip install google-auth requests
      - name: Authenticate using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Verify Search Console API and list authorized properties
        run: |
          python - <<'PY'
          import google.auth
          from google.auth.transport.requests import AuthorizedSession
          credentials, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/webmasters.readonly"])
          response = AuthorizedSession(credentials).get(
              "https://searchconsole.googleapis.com/webmasters/v3/sites", timeout=30
          )
          print("HTTP status:", response.status_code)
          response.raise_for_status()
          entries = response.json().get("siteEntry", [])
          print("Accessible Search Console properties:", len(entries))
          for entry in entries:
              print("-", entry.get("siteUrl"), "permission:", entry.get("permissionLevel"))
          if not entries:
              print("ACTION REQUIRED: Add the service account email as a user on each client's Search Console property.")
          PY
